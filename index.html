<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>طلبات Moon Blossom المسبقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#faf6f7; --card:#ffffff; --text:#2b2227; --muted:#7d6f76; --line:#eadfe3;
  --accent:#a8496f; --accent-soft:#f6e3ea; --on-accent:#fff;
  --ok:#2f7d57; --ok-bg:#e3f3ea; --warn:#a56a12; --warn-bg:#fbefd6; --bad:#b3372f; --bad-bg:#f9e0de;
  --shadow:0 1px 3px rgba(60,20,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a1417; --card:#251c21; --text:#f3e9ed; --muted:#a8969e; --line:#3a2c33;
    --accent:#e08aa9; --accent-soft:#3b2530; --on-accent:#2b1520;
    --ok:#6fcf9b; --ok-bg:#1f3a2c; --warn:#e8b45a; --warn-bg:#3d2f14; --bad:#f08a82; --bad-bg:#431f1c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1a1417; --card:#251c21; --text:#f3e9ed; --muted:#a8969e; --line:#3a2c33;
  --accent:#e08aa9; --accent-soft:#3b2530; --on-accent:#2b1520;
  --ok:#6fcf9b; --ok-bg:#1f3a2c; --warn:#e8b45a; --warn-bg:#3d2f14; --bad:#f08a82; --bad-bg:#431f1c;
  --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:700}
h1 small{display:block;font-size:13px;color:var(--muted);font-weight:400}
.btn{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.tools{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
input[type=text],input[type=number],input[type=search],textarea{width:100%;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{resize:vertical;min-height:64px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{font:inherit;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:12px;box-shadow:var(--shadow)}
.card.na{opacity:.8}
.thumb{width:96px;height:96px;flex:none;border-radius:12px;background:var(--accent-soft);object-fit:cover;cursor:zoom-in;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent)}
.info{flex:1;min-width:0}
.title{font-weight:700;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.prices{display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0;font-size:14px}
.prices b{color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font:inherit;font-size:13px;border:0;border-radius:999px;padding:5px 12px;cursor:pointer;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.edit{background:var(--accent-soft);color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick{display:flex;align-items:center;gap:12px}
.pick .thumb{cursor:pointer}
.checks{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px}
.checks label{display:flex;align-items:center;gap:6px;font-size:15px}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.lightbox{align-items:center}
.lightbox img{max-width:94%;max-height:90%;border-radius:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:40;display:none}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:18px;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:14px 20px;border-radius:999px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>الطلبات المسبقة<small>Moon Blossom</small></h1>
    <button class="btn" id="addTop">+ طلب جديد</button>
  </header>

  <div id="banner"></div>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>كل الطلبات</span></div>
    <div class="stat"><b id="sPending">0</b><span>بانتظار التوصيل</span></div>
    <div class="stat"><b id="sMoney">0</b><span>مبالغ لم تُسلَّم</span></div>
  </div>

  <div class="tools">
    <input type="search" id="search" placeholder="بحث بالاسم أو العميل أو الملاحظات…">
    <div class="chips" id="chips">
      <button class="chip on" data-f="all">الكل</button>
      <button class="chip" data-f="pending">لم يُوصَّل</button>
      <button class="chip" data-f="delivered">تم التوصيل</button>
      <button class="chip" data-f="unavailable">غير متوفر</button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div id="backup" style="display:none;gap:8px;margin-top:18px">
    <button class="btn ghost" id="exportBtn" style="flex:1">تحميل نسخة احتياطية</button>
    <button class="btn ghost" id="importBtn" style="flex:1">استرجاع نسخة</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<button class="btn fab" id="addFab">+ إضافة</button>

<div class="overlay" id="formOv">
  <div class="sheet">
    <h2 id="formTitle">طلب جديد</h2>
    <div class="field">
      <label>صورة المنتج</label>
      <div class="pick">
        <div class="thumb" id="preview" role="button" tabindex="0">📷</div>
        <div>
          <button class="btn ghost" type="button" id="pickBtn">اختيار صورة</button>
          <input type="file" id="file" accept="image/*" hidden>
        </div>
      </div>
    </div>
    <div class="field"><label>اسم / وصف المنتج</label><input type="text" id="fName" placeholder="مثال: حقيبة كتف بيج"></div>
    <div class="field"><label>اسم العميلة (اختياري)</label><input type="text" id="fCustomer"></div>
    <div class="row2">
      <div class="field"><label>سعر المنتج</label><input type="number" id="fPrice" inputmode="decimal" min="0" step="any"></div>
      <div class="field"><label>سعر التوصيل</label><input type="number" id="fDelivery" inputmode="decimal" min="0" step="any"></div>
    </div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="fNotes"></textarea></div>
    <div class="checks">
      <label><input type="checkbox" id="fAvail" checked> متوفر</label>
      <label><input type="checkbox" id="fDelivered"> تم التوصيل</label>
    </div>
    <div class="actions">
      <button class="btn" id="saveBtn">حفظ</button>
      <button class="btn ghost" id="cancelBtn">إلغاء</button>
    </div>
  </div>
</div>

<div class="overlay lightbox" id="lightbox"><img id="lbImg" alt=""></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var orders=[], filter='all', query='', backend=null, editing=null, pendingFile=null;

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function num(v){var n=parseFloat(v);return isFinite(n)?n:0}
  function fmt(n){return Number(n).toLocaleString('en-US',{maximumFractionDigits:2})}
  function toast(msg){var t=$('#toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},2600)}
  function imgSrc(o){return o.imageId?('/_blob/'+o.imageId):(o.imageData||'')}

  /* ---------- image helpers ---------- */
  function compress(file,max,q){
    return new Promise(function(res,rej){
      var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){
        var w=img.width,h=img.height,s=Math.min(1,max/Math.max(w,h));
        w=Math.round(w*s);h=Math.round(h*s);
        var c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        c.toBlob(function(b){b?res(b):rej(new Error('compress'))},'image/jpeg',q);
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('image'))};
      img.src=url;
    });
  }
  function toDataURL(blob){
    return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(r.error)};r.readAsDataURL(blob)});
  }

  /* ---------- storage backends ---------- */
  function makeDbBackend(db,assets){
    var col=db.collection('orders');
    return {
      mode:'db',
      subscribe:function(cb,onErr){
        col.onSnapshot(function(s){
          cb(s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x}));
        },function(e){onErr&&onErr(e)});
      },
      save:function(o){
        var id=o.id||col.doc().id, data={};
        Object.keys(o).forEach(function(k){if(k!=='id'&&o[k]!==undefined)data[k]=o[k]});
        return col.doc(id).set(data);
      },
      patch:function(id,p){return col.doc(id).update(p)},
      remove:function(o){
        return col.doc(o.id).delete().then(function(){
          if(o.imageId&&assets){return assets.delete(o.imageId).catch(function(){})}
        });
      },
      image:function(file){
        if(assets){
          return compress(file,1000,.8).then(function(b){return assets.upload(b)}).then(function(r){return {imageId:r.id}});
        }
        return compress(file,700,.7).then(toDataURL).then(function(d){return {imageData:d}});
      }
    };
  }
  function makeLocalBackend(){
    var KEY='moonblossom_preorders_v1', list=[], cb=null;
    try{list=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){list=[]}
    function persist(){
      try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){toast('مساحة التخزين ممتلئة')}
      cb&&cb(list.slice());
    }
    return {
      mode:'local',
      subscribe:function(c){cb=c;cb(list.slice())},
      save:function(o){
        if(!o.id){o.id='o'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
        var i=list.findIndex(function(x){return x.id===o.id});
        if(i>=0)list[i]=o;else list.push(o);
        persist();return Promise.resolve();
      },
      patch:function(id,p){
        var o=list.find(function(x){return x.id===id});
        if(o)Object.keys(p).forEach(function(k){o[k]=p[k]});
        persist();return Promise.resolve();
      },
      remove:function(o){list=list.filter(function(x){return x.id!==o.id});persist();return Promise.resolve()},
      all:function(){return list.slice()},
      replaceAll:function(l){list=l;persist()},
      image:function(file){return compress(file,600,.65).then(toDataURL).then(function(d){return {imageData:d}})}
    };
  }

  /* ---------- rendering ---------- */
  function visible(){
    var q=query.trim().toLowerCase();
    return orders.filter(function(o){
      if(filter==='pending'&&(o.delivered||o.available===false))return false;
      if(filter==='delivered'&&!o.delivered)return false;
      if(filter==='unavailable'&&o.available!==false)return false;
      if(q){
        var hay=((o.name||'')+' '+(o.customer||'')+' '+(o.notes||'')).toLowerCase();
        if(hay.indexOf(q)<0)return false;
      }
      return true;
    }).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
  }
  function render(){
    var pending=orders.filter(function(o){return !o.delivered&&o.available!==false});
    $('#sTotal').textContent=orders.length;
    $('#sPending').textContent=pending.length;
    $('#sMoney').textContent=fmt(pending.reduce(function(s,o){return s+num(o.price)+num(o.delivery)},0));
    var items=visible(), box=$('#list');
    if(!items.length){
      box.innerHTML='<div class="empty">'+(orders.length?'لا توجد نتائج مطابقة':'لا توجد طلبات بعد. اضغطي «إضافة» لتسجيل أول طلب 🌙')+'</div>';
      return;
    }
    box.innerHTML=items.map(function(o){
      var src=imgSrc(o), avail=o.available!==false, del=!!o.delivered, total=num(o.price)+num(o.delivery);
      var thumb=src?'<img class="thumb" data-act="zoom" data-id="'+esc(o.id)+'" src="'+esc(src)+'" alt="">':'<div class="thumb" style="cursor:default">👜</div>';
      return '<div class="card'+(avail?'':' na')+'">'+thumb+
        '<div class="info">'+
          '<div class="title">'+esc(o.name||'منتج بدون اسم')+'</div>'+
          (o.customer?'<div class="sub">العميلة: '+esc(o.customer)+'</div>':'')+
          '<div class="prices"><span>السعر: <b>'+fmt(num(o.price))+'</b></span><span>التوصيل: <b>'+fmt(num(o.delivery))+'</b></span><span>الإجمالي: <b>'+fmt(total)+'</b></span></div>'+
          (o.notes?'<div class="sub">'+esc(o.notes)+'</div>':'')+
          '<div class="pills">'+
            '<button class="pill '+(avail?'ok':'bad')+'" data-act="avail" data-id="'+esc(o.id)+'">'+(avail?'✅ متوفر':'⛔ غير متوفر')+'</button>'+
            '<button class="pill '+(del?'ok':'warn')+'" data-act="deliv" data-id="'+esc(o.id)+'">'+(del?'🚚 تم التوصيل':'⏳ لم يُوصَّل')+'</button>'+
            '<button class="pill edit" data-act="edit" data-id="'+esc(o.id)+'">تعديل</button>'+
            '<button class="pill bad" data-act="del" data-id="'+esc(o.id)+'">حذف</button>'+
          '</div>'+
        '</div></div>';
    }).join('');
  }

  /* ---------- form ---------- */
  function setPreview(src){
    var p=$('#preview');
    if(src){p.innerHTML='';p.style.backgroundImage='url("'+src.replace(/"/g,'%22')+'")';p.style.backgroundSize='cover';p.style.backgroundPosition='center'}
    else{p.style.backgroundImage='';p.textContent='📷'}
  }
  function openForm(o){
    editing=o||null;pendingFile=null;
    $('#formTitle').textContent=o?'تعديل الطلب':'طلب جديد';
    $('#fName').value=o&&o.name||'';
    $('#fCustomer').value=o&&o.customer||'';
    $('#fPrice').value=o&&o.price!=null?o.price:'';
    $('#fDelivery').value=o&&o.delivery!=null?o.delivery:'';
    $('#fNotes').value=o&&o.notes||'';
    $('#fAvail').checked=o?o.available!==false:true;
    $('#fDelivered').checked=o?!!o.delivered:false;
    $('#file').value='';
    setPreview(o?imgSrc(o):'');
    $('#saveBtn').disabled=false;$('#saveBtn').textContent='حفظ';
    $('#formOv').classList.add('open');
  }
  function closeForm(){$('#formOv').classList.remove('open');editing=null;pendingFile=null}

  function save(){
    var btn=$('#saveBtn');btn.disabled=true;btn.textContent='جارٍ الحفظ…';
    var base=editing?Object.assign({},editing):{createdAt:Date.now()};
    base.name=$('#fName').value.trim();
    base.customer=$('#fCustomer').value.trim();
    base.price=num($('#fPrice').value);
    base.delivery=num($('#fDelivery').value);
    base.notes=$('#fNotes').value.trim();
    base.available=$('#fAvail').checked;
    base.delivered=$('#fDelivered').checked;
    var imgStep=pendingFile?backend.image(pendingFile):Promise.resolve(null);
    imgStep.then(function(img){
      var oldId=editing&&editing.imageId;
      if(img){
        delete base.imageId;delete base.imageData;
        Object.assign(base,img);
      }
      return backend.save(base).then(function(){
        if(img&&oldId&&oldId!==img.imageId&&backend.mode==='db'){/* old image left in storage; harmless */}
        closeForm();toast('تم الحفظ');
      });
    }).catch(function(e){
      btn.disabled=false;btn.textContent='حفظ';
      var code=e&&e.code;
      if(code==='too_large'||code==='quota_or_state'||code==='quota_exceeded')toast('تعذّر الحفظ: المساحة ممتلئة');
      else if(code==='invalid_argument')toast('ليس لديك صلاحية التعديل');
      else toast('تعذّر الحفظ، حاولي مرة أخرى');
    });
  }

  /* ---------- events ---------- */
  function find(id){return orders.find(function(o){return o.id===id})}
  $('#list').addEventListener('click',function(ev){
    var t=ev.target.closest('[data-act]');if(!t)return;
    var o=find(t.getAttribute('data-id'));if(!o)return;
    var act=t.getAttribute('data-act');
    function fail(){toast('تعذّر التحديث')}
    if(act==='avail')backend.patch(o.id,{available:o.available===false}).catch(fail);
    else if(act==='deliv')backend.patch(o.id,{delivered:!o.delivered}).catch(fail);
    else if(act==='edit')openForm(o);
    else if(act==='zoom'){$('#lbImg').src=imgSrc(o);$('#lightbox').classList.add('open')}
    else if(act==='del'){
      if(confirm('حذف هذا الطلب نهائيًا؟'))backend.remove(o).catch(fail);
    }
  });
  $('#lightbox').addEventListener('click',function(){this.classList.remove('open')});
  $('#addTop').addEventListener('click',function(){openForm()});
  $('#addFab').addEventListener('click',function(){openForm()});
  $('#cancelBtn').addEventListener('click',closeForm);
  $('#formOv').addEventListener('click',function(e){if(e.target===this)closeForm()});
  $('#saveBtn').addEventListener('click',save);
  $('#pickBtn').addEventListener('click',function(){$('#file').click()});
  $('#preview').addEventListener('click',function(){$('#file').click()});
  $('#file').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f)return;
    pendingFile=f;
    var r=new FileReader();r.onload=function(){setPreview(r.result)};r.readAsDataURL(f);
  });
  $('#search').addEventListener('input',function(){query=this.value;render()});
  $('#chips').addEventListener('click',function(e){
    var c=e.target.closest('.chip');if(!c)return;
    filter=c.getAttribute('data-f');
    document.querySelectorAll('.chip').forEach(function(x){x.classList.toggle('on',x===c)});
    render();
  });

  $('#exportBtn').addEventListener('click',function(){
    if(!backend||backend.mode!=='local')return;
    var blob=new Blob([JSON.stringify(backend.all())],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='moon-blossom-orders-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
  });
  $('#importBtn').addEventListener('click',function(){$('#importFile').click()});
  $('#importFile').addEventListener('change',function(){
    var f=this.files&&this.files[0];if(!f||!backend||backend.mode!=='local')return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var l=JSON.parse(r.result);
        if(!Array.isArray(l))throw 0;
        if(confirm('سيتم استبدال الطلبات الحالية بالنسخة المحمّلة. متابعة؟')){backend.replaceAll(l);toast('تم الاسترجاع')}
      }catch(e){toast('الملف غير صالح')}
    };
    r.readAsText(f);this.value='';
  });

  /* ---------- start ---------- */
  render();
  function start(db,assets){
    if(db){
      backend=makeDbBackend(db,assets);
    }else{
      backend=makeLocalBackend();
      $('#banner').innerHTML='<div class="banner">الطلبات تُحفظ على هذا الهاتف وهذا المتصفح فقط. حمّلي نسخة احتياطية من الأسفل من وقت لآخر.</div>';
      $('#backup').style.display='flex';
    }
    backend.subscribe(function(list){orders=list;render()},function(){toast('انقطع الاتصال بالتخزين')});
  }
  var useFn=window.claude&&window.claude.use?window.claude.use.bind(window.claude):null;
  if(!useFn){start(null,null)}
  else{
    Promise.all([useFn('db'),useFn('assets')]).then(function(r){start(r[0],r[1])}).catch(function(){start(null,null)});
  }
})();
</script>
</body>
</html>
